<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="Signup.css" />
</head>
<body>

  <div class="auth-container">

    <!-- Left Image Section -->
    <div class="auth-image">
        <img src="logo.png">

      <div class="about-text">
         <h3>Why Art & Craft?</h3>

      <ul>
        <li>👉Learn creative skills from industry experts</li>
        <li>👉Explore hands-on art & craft courses</li>
        <li>👉Build and showcase your creative portfolio</li>
        <li>👉Join a community of passionate creators</li>
      </ul>
        
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="auth-form">
      <h1>Create an account</h1>
      <p class="sub-text">
        Already have an account? <a href="Login.html">Login</a>
      </p>

      <form>
        <div class="input-row">
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="Last name" />
        </div>

        <input type="text" placeholder="Mobile Number" />
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />

        <label class="checkbox">
          <input type="checkbox" />
          <span required>I agree to the <a href="#">Terms & Conditions</a></span>
        </label>

        <button type="submit" class="primary-btn">
          Create account
        </button>

        <div class="divider">or register with</div>

        <div class="social-buttons">
          <button type="button">Google</button>
          <button type="button">Apple</button>
        </div>
      </form>
    </div>

  </div>

<script src="config.js"></script>
<script src="Signup.js"></script>
</body>
</html>
