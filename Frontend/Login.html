<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="Login.css" />
</head>
<body>

<div class="auth-container">

  <!-- LEFT SECTION -->
  <div class="auth-image">
    <img src="logo.png" alt="Art & Craft">

    <div class="about-text">
      <h3>Why Art & Craft?</h3>
      <ul>
        <li>👉 Learn creative skills from industry experts</li>
        <li>👉 Explore hands-on art & craft courses</li>
        <li>👉 Build and showcase your creative portfolio</li>
        <li>👉 Join a community of passionate creators</li>
      </ul>
    </div>
  </div>

  <!-- RIGHT SECTION -->
  <div class="auth-form">
    <h1>Login</h1>
    <p class="sub-text">
      Don’t have an account?
      <a href="#Signup">Sign up</a>
    </p>

    <form>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />

      <label class="checkbox">
        <input type="checkbox" />
        <span>Remember me</span>
      </label>

      <button id="Login" type="submit">Login</button>

      <p class="divider">or login with</p>

      <div class="social-buttons">
        <button class="google">Google</button>
        <button class="apple">Apple</button>
      </div>
    </form>
  </div>

</div>

    <script src="config.js"></script>
    <script src="Login.js"></script>
</body>
</html>
